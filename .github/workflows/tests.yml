name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.preset }}
    # clang 22 / gcc 15; ubuntu-latest (24.04) only has clang 18 / gcc 14
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug_validation
          - release_validation
          - gcc_debug_validation
          - gcc_release_validation

    steps:

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install compilers
        run: |
          sudo apt-get update
          if [[ "${{ matrix.preset }}" == gcc_* ]]; then
            sudo apt-get install -y g++-15
            # presets invoke bare gcc/g++, point them at the pinned version
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 200
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 200
          else
            sudo apt-get install -y clang-22
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 200
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 200
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
